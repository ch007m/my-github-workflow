name: Build only

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Check secrets
        run: |
          if [ -n "$FOO" ]; then
            echo "FOO secret is set"
          else
            echo "FOO secret is NOT set"
          fi
        env:
          FOO: ${{ secrets.FOO }}

      - name: Build with Maven
        run: mvn -B package -DskipTests
