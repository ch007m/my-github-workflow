name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Echo secrets
        run: |
          echo "============================================"
          echo "Logging environment secrets for ci-testing"
          echo "============================================"
          echo ""
          echo ">> FOO value is: ${{ secrets.FOO }}"
          #echo ">> API_KEY value is: ${{ secrets.API_KEY }}"
          echo ""
          echo "Note: GitHub Actions masks secret values in logs"
          echo "============================================"    

      - name: Build with Maven
        run: mvn -B package -DskipTests

  test:
    needs: build
    runs-on: ubuntu-latest
    environment: ci-testing
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Echo secrets
        run: |
          echo "============================================"
          echo "Logging environment secrets for ci-testing"
          echo "============================================"
          echo ""
          echo ">> FOO value is: ${{ secrets.FOO }}"
          #echo ">> API_KEY value is: ${{ secrets.API_KEY }}"
          echo ""
          echo "Note: GitHub Actions masks secret values in logs"
          echo "============================================"

      - name: Run tests
        run: mvn test
