name: PR test

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

env:
  JAVA_VERSION: '21'
  ACP_AGENT: ibm-bob
  SMALLRYE_ACP_VERSION: '0.2.1'
  IBM_BOB_VERSION: '2.0.5'

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  instructions:
    name: Set instructions
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '### AI Test required before merge',
                '',
                'A maintainer must add the `status: to-test` label to trigger the following jobs of the pipeline.',
                '',
                '| Job | Description |',
                '|-------|-------------|',
                '| **Build HelloWorld application** | Builds the project from main |',
                '| **Export artifacts from PR** | Detects SKILL file changes |',
                '| **Run AI tests** | Run AI tests on SKILL (if changed) |',
                '| **Pipeline** | Pipeline and jobs status — must pass before merge |',
              ].join('\n')
            });

  build:
    name: Build Quarkus MCP server
    if: >
      github.repository_owner == 'ch007m' &&
      contains(github.event.pull_request.labels.*.name, 'status: to-test')
    uses: ./.github/workflows/build-jar.yml

  export:
    needs: build
    name: Export artifacts from PR
    uses: ./.github/workflows/pr-skill-diff.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  process:
    name: Run tests ...
    needs: [build,export]
    if: needs.export.outputs.skills_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download SKILL artifacts
        uses: actions/download-artifact@v4
        with:
          name: pr-artifacts
          path: skills/

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: quarkus-mcp-server
          path: jar/

      - name: Install Smallrye ACP and agents
        uses: ./.github/actions/acp-agent-action
        with:
          java_version: ${{ env.JAVA_VERSION }}
          smallrye_acp_version: ${{ env.SMALLRYE_ACP_VERSION }}
          agents: ${{ env.ACP_AGENT }}
          bobshell_version: ${{ env.IBM_BOB_VERSION }}
          registry_file: ./.github/actions/acp-agent-action/ibm-bob-acp-registry.json

      #- name: Start HelloWorld JAR
      #  run: |
      #    set -euo pipefail
      #    java -jar jar/helloworld-1.0-SNAPSHOT.jar

      - name: Process SKILL artifacts
        run: |
          set -euo pipefail

          echo "=== Changed SKILL files ==="
          cat skills/changed-skills.txt
          echo ""

          failed=0

          while IFS= read -r skill_path; do
            [[ -z "$skill_path" ]] && continue

            skill_dir=$(dirname "$skill_path")
            skill_name=$(basename "$skill_dir")

            echo "--- Running skill: ${skill_name} (${skill_path}) ---"
            if acp run \
              -a ${{ env.ACP_AGENT }} \
              --backup no \
              -s "${skill_path}" \
              --mcp-server-config '{"type":"stdio","name":"greet-tools","command":"java","args":["-jar","jar/quarkus-mcp-1.0.0-SNAPSHOT-runner.jar"]}' \
              -p "Greet"; then
              echo "✅ ${skill_name} passed"
            else
              echo "::error title=SKILL Test::${skill_name} failed (${skill_path})"
              failed=$((failed + 1))
            fi
            echo ""
          done < skills/changed-skills.txt

          if [[ "$failed" -gt 0 ]]; then
            echo "::error title=SKILL Tests::${failed} skill test(s) failed"
            exit 1
          fi

          echo "All skill tests passed!"
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}

      - name: Report session metrics
        if: always()
        run: |
          set -euo pipefail

          DB="$HOME/.bob/db/bob.db"

          if [[ ! -f "$DB" ]]; then
            echo "No Bob DB found — skipping metrics"
            exit 0
          fi

          SESSION_ID=$(sqlite3 "$DB" "
            SELECT id FROM tasks
            WHERE costs IS NOT NULL
              AND json_extract(costs, '\$.cost') > 0
              AND first_message IS NOT NULL
            ORDER BY created_at DESC
            LIMIT 1;
          ")

          if [[ -z "$SESSION_ID" ]]; then
            echo "No session with cost data found"
            exit 0
          fi

          echo "SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"

          METRICS=$(sqlite3 "$DB" "
            SELECT
              printf('%ds', (updated_at - created_at) / 1000),
              COALESCE(json_extract(costs, '\$.input'), 'n/a'),
              COALESCE(json_extract(costs, '\$.output'), 'n/a'),
              COALESCE(json_extract(costs, '\$.cacheRead'), 'n/a'),
              COALESCE(json_extract(costs, '\$.cacheWrite'), 'n/a'),
              printf('\$%.4f', json_extract(costs, '\$.cost')),
              COALESCE(json_extract(costs, '\$.contextTokens'), 'n/a')
            FROM tasks
            WHERE id = '$SESSION_ID';
          ")

          if [[ -z "$METRICS" ]]; then
            echo "No metrics found for session $SESSION_ID"
            exit 0
          fi

          IFS='|' read -r duration input output cache_read cache_write cost ctx <<< "$METRICS"

          echo "=== Session Metrics ==="
          echo "Session ID:     $SESSION_ID"
          echo "Duration:       $duration"
          echo "Input tokens:   $input"
          echo "Output tokens:  $output"
          echo "Cache read:     $cache_read"
          echo "Cache write:    $cache_write"
          echo "Cost (USD):     $cost"
          echo "Context tokens: $ctx"

          {
            echo "### Session Metrics"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Session ID | \`$SESSION_ID\` |"
            echo "| Duration | $duration |"
            echo "| Input tokens | $input |"
            echo "| Output tokens | $output |"
            echo "| Cache read | $cache_read |"
            echo "| Cache write | $cache_write |"
            echo "| Cost (USD) | $cost |"
            echo "| Context tokens | $ctx |"
          } >> "$GITHUB_STEP_SUMMARY"

  pipeline:
    name: AI Test
    needs: [export, build, process]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Set job status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          REPO="${{ github.repository }}"

          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'status: to-test') }}" != "true" ]]; then
            gh api "repos/$REPO/statuses/$SHA" \
              -f state=pending \
              -f "context=AI Test" \
              -f "description=Waiting for 'status: to-test' label"
            echo "Status set to pending — label not applied yet"
            exit 0
          fi

          if [[ "${{ needs.export.result }}" == "failure" || "${{ needs.build.result }}" == "failure" ]]; then
            gh api "repos/$REPO/statuses/$SHA" \
              -f state=failure \
              -f "context=AI Test" \
              -f "description=Build or export failed"
            exit 0
          fi

          if [[ "${{ needs.process.result }}" == "failure" ]]; then
            gh api "repos/$REPO/statuses/$SHA" \
              -f state=failure \
              -f "context=AI Test" \
              -f "description=SKILL processing failed"
            exit 0
          fi

          gh api "repos/$REPO/statuses/$SHA" \
            -f state=success \
            -f "context=AI Test" \
            -f "description=All tests passed"
