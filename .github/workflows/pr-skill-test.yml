name: Process SKILL if changed

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  build-jar:
    if: >
      github.repository_owner == 'ch007m' &&
      contains(github.event.pull_request.labels.*.name, 'status: to-test')
    uses: ./.github/workflows/build-jar.yml

  export:
    needs: build-jar
    if: >
      github.repository_owner == 'ch007m' &&
      contains(github.event.pull_request.labels.*.name, 'status: to-test')
    uses: ./.github/workflows/pr-skill-diff.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  process:
    name: Process PR's artifacts
    needs: [build-jar,export]
    if: needs.export.outputs.skills_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download SKILL artifacts
        uses: actions/download-artifact@v4
        with:
          name: pr-artifacts
          path: downloaded/

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: helloworld-jar
          path: jar/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run HelloWorld JAR
        run: java -jar jar/helloworld-1.0-SNAPSHOT.jar

      - name: Process SKILL artifacts
        run: |
          echo "=== Changed SKILL files ==="
          cat downloaded/changed-skills.txt
          echo ""
          echo "=== PR info ==="
          cat downloaded/pr-info.txt
          cat downloaded/report.txt
          echo ""
          echo "=== Processing SKILL artifacts ..."
          echo "Post-export processing completed successfully!"
        env:
          FOO: ${{ secrets.FOO }}

  gate:
    name: test-gate
    needs: [export, build-jar, process]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'status: to-test') }}" != "true" ]]; then
            echo "Label 'status: to-test' is required to run the tests before to merge"
            exit 1
          fi
          if [[ "${{ needs.export.result }}" == "failure" || "${{ needs.build-jar.result }}" == "failure" ]]; then
            echo "Build or export failed"
            exit 1
          fi
          if [[ "${{ needs.process.result }}" == "failure" ]]; then
            echo "SKILL processing failed"
            exit 1
          fi
          echo "All checks passed"
