name: PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  instructions:
    name: Set instructions
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '### AI Test required before merge',
                '',
                'A maintainer must add the `status: to-test` label to trigger the CI pipeline.',
                '',
                '| Job | Description |',
                '|-------|-------------|',
                '| **Build HelloWorld application** | Builds the project from main |',
                '| **Export artifacts from PR** | Detects SKILL file changes |',
                '| **Run AI tests** | Run AI tests on SKILL (if changed) |',
                '| **Pipeline** | Pipeline and jobs status — must pass before merge |',
              ].join('\n')
            });

  build:
    name: Build HelloWorld application
    if: >
      github.repository_owner == 'ch007m' &&
      contains(github.event.pull_request.labels.*.name, 'status: to-test')
    uses: ./.github/workflows/pr-build-jar.yml

  export:
    needs: build
    name: Export artifacts from PR
    uses: ./.github/workflows/pr-skill-diff.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  process:
    name: Run tests ...
    needs: [build,export]
    if: needs.export.outputs.skills_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download SKILL artifacts
        uses: actions/download-artifact@v4
        with:
          name: pr-artifacts
          path: skills/

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: helloworld-jar
          path: jar/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run HelloWorld JAR
        run: java -jar jar/helloworld-1.0-SNAPSHOT.jar

      - name: Process SKILL artifacts
        run: |
          echo "=== Changed SKILL files ==="
          cat skills/changed-skills.txt
          echo ""
          echo "=== PR info ==="
          cat skills/pr-info.txt
          cat skills/report.txt
          echo ""
          echo "=== Processing SKILL artifacts ..."
          echo "Post-export processing completed successfully!"
        env:
          FOO: ${{ secrets.FOO }}

  pipeline:
    name: PR AI Test
    needs: [export, build, process]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Set job status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          REPO="${{ github.repository }}"

          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'status: to-test') }}" != "true" ]]; then
            gh api "repos/$REPO/statuses/$SHA" \
              -f state=pending \
              -f "context=PR AI Test" \
              -f "description=Waiting for 'status: to-test' label"
            echo "Status set to pending — label not applied yet"
            exit 0
          fi

          if [[ "${{ needs.export.result }}" == "failure" || "${{ needs.build.result }}" == "failure" ]]; then
            gh api "repos/$REPO/statuses/$SHA" \
              -f state=failure \
              -f "context=PR AI Test" \
              -f "description=Build or export failed"
            exit 0
          fi

          if [[ "${{ needs.process.result }}" == "failure" ]]; then
            gh api "repos/$REPO/statuses/$SHA" \
              -f state=failure \
              -f "context=PR AI Test" \
              -f "description=SKILL processing failed"
            exit 0
          fi

          gh api "repos/$REPO/statuses/$SHA" \
            -f state=success \
            -f "context=PR AI Test" \
            -f "description=All tests passed"
