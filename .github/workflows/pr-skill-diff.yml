name: Check if SKILL diff and export

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout
        required: false
        type: string
    outputs:
      skills_changed:
        description: Whether SKILL files were changed
        value: ${{ jobs.export.outputs.skills_changed }}

jobs:
  export:
    name: Export PR Artifacts
    runs-on: ubuntu-latest
    outputs:
      skills_changed: ${{ steps.check-skills.outputs.changed }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0

      - name: Check if SKILL files changed
        id: check-skills
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main..HEAD -- '*.skill' '**/SKILL*' '**/skills/**' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "SKILL files changed:"
            echo "$CHANGED_FILES"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No SKILL files changed"
          fi

      - name: Scan the skills
        if: steps.check-skills.outputs.changed == 'true'
        uses: NPJigaK/skillspector-action@v1
        with:
          path: .
          changed-only: true

      - name: Generate artifacts
        if: steps.check-skills.outputs.changed == 'true'
        run: |
          mkdir -p skills
          echo "head_sha=${{ inputs.ref }}" > skills/pr-info.txt
          git diff --name-only origin/main..HEAD -- '*.skill' '**/SKILL*' '**/skills/**' > skills/changed-skills.txt
          echo "Build report generated at $(date -u)" > skills/report.txt

      - name: Upload artifacts
        if: steps.check-skills.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-artifacts
          path: skills/
