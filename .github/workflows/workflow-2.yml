name: Workflow 2 (Gated Execution)

on:
  workflow_dispatch:
  #pull_request:
  #  types: [opened, labeled, synchronize]

jobs:
  gated-execution:
    name: Approved Deployment / Integration
    runs-on: ubuntu-latest
    steps:
      - name: Check approval label
        run: |
          if [ "$HAS_LABEL" != "true" ]; then
            echo "Merge blocked: add the 'approved' label to proceed"
            exit 1
          fi
        env:
          HAS_LABEL: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'status: approved') }}

      - name: Check out PR code
        uses: actions/checkout@v4

      - name: Run Workflow 2 logic
        run: |
          echo "Approved! Executing Workflow 2..."
          echo "Workflow 2 completed successfully!"