name: Workflow 3 (Export Artifacts)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout
        required: false
        type: string

jobs:
  export:
    name: Export PR Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Show git log
        run: |
          echo "Show git log ..."
          git log --pretty=format:'%C(yellow)%h %Cred%ad %Cblue%an%Cgreen%d %Creset%s' --date=short $argv 

      - name: Generate artifacts
        run: |
          mkdir -p output
          echo "head_sha=${{ inputs.ref }}" > output/pr-info.txt
          echo "Build report generated at $(date -u)" > output/report.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-artifacts
          path: output/
