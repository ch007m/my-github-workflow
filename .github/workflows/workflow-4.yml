name: Workflow 4 (Post-Export Processing)

on:
  workflow_run:
    workflows: ["Workflow 3 (Export Artifacts)"]
    types:
      - completed

permissions:
  contents: read
  statuses: write
  actions: read
  pull-requests: write

jobs:
  process:
    name: Process Exported Artifacts
    runs-on: ubuntu-latest
    if: >
      github.repository_owner == 'ch007m' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Get PR number
        id: pr
        run: |
          PR_NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
            --jq '.[0].number // empty')
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Set pending status
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            --method POST \
            -f state=pending \
            -f context=post-export-processing \
            -f description="Processing exported artifacts..."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Comment processing started
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "⏳ **Post-export processing started** — [View run](https://github.com/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }})"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}

      - name: Download artifacts from workflow 3
        uses: actions/download-artifact@v4
        with:
          name: pr-artifacts
          path: downloaded/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Process artifacts
        id: process
        run: |
          echo "=== Downloaded artifacts ==="
          cat downloaded/pr-info.txt
          cat downloaded/report.txt
          echo ""
          echo "Processing artifacts..."
          echo "Post-export processing completed successfully!"

      - name: Set final status (success)
        if: success()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            --method POST \
            -f state=success \
            -f context=post-export-processing \
            -f description="Artifact processing completed"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "✅ **Post-export processing completed** — [View run](https://github.com/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }})"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}

      - name: Set final status (failure)
        if: failure()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            --method POST \
            -f state=failure \
            -f context=post-export-processing \
            -f description="Artifact processing failed"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "❌ **Post-export processing failed** — [View run](https://github.com/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }})"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
