name: Workflow 4 (Export and Process Artifacts)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  export:
    if: >
      github.repository_owner == 'ch007m' &&
      contains(github.event.pull_request.labels.*.name, 'status: to-test')
    uses: ./.github/workflows/workflow-3.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  process:
    name: Process Exported Artifacts
    needs: export
    if: needs.export.outputs.skills_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: pr-artifacts
          path: downloaded/

      - name: Process SKILL artifacts
        run: |
          echo "=== Changed SKILL files ==="
          cat downloaded/changed-skills.txt
          echo ""
          echo "=== PR info ==="
          cat downloaded/pr-info.txt
          cat downloaded/report.txt
          echo ""
          echo "Processing SKILL artifacts..."
          echo "Post-export processing completed successfully!"
