name: Build JAR

on:
  workflow_call:
    inputs:
      java_version:
        description: JDK version to use for the build.
        required: false
        type: string
        default: '21'

jobs:
  build:
    name: Build and export JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package -f mcp/servers/quarkus-mcp/pom.xml

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-mcp-server
          path: mcp/servers/quarkus-mcp/target/quarkus-mcp-1.0.0-SNAPSHOT-runner.jar
