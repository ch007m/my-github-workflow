name: PR Commands

on:
  pull_request:
    branches: [main]
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

env:
  HELP_MESSAGE: |
    **Available commands:**
    | Command | Description |
    |---------|-------------|
    | `/ok-to-test` | Approve tests (maintainers); persists on pushes. |
    | `/stop-test` | Remove test approval (maintainers only) |
    | `/help` | Show this help message |

jobs:
  welcome:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    steps:
      - name: Post available commands
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "$HELP_MESSAGE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  help:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/help')
    steps:
      - name: Post available commands
        run: |
          gh pr comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "$HELP_MESSAGE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  approve:
    runs-on: ubuntu-latest
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/ok-to-test' &&
      (
        contains(
          fromJSON(vars.MAINTAINERS || '[]'),
          github.event.comment.user.login
        ) ||
        contains(
          fromJSON(vars.MAINTAINER_ASSOCIATIONS || '["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.comment.author_association
        )
      )
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Add approval label and get PR head SHA
        id: pr
        run: |
          gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --add-label "ok-to-test"
          sha=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
            --json headRefOid --jq .headRefOid)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}

  run-tests:
    needs: approve
    uses: ./.github/workflows/test-and-package.yml
    with:
      ref: ${{ needs.approve.outputs.sha }}
    secrets:
      FOO: ${{ secrets.FOO }}

  set-test-gate:
    needs: [approve, run-tests]
    if: >
      always() &&
      needs.approve.result == 'success' &&
      needs.run-tests.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Update test-gate status
        run: |
          approved=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
            --json labels --jq 'any(.labels[]; .name == "ok-to-test")')

          if [[ "$approved" == "true" && "$TEST_RESULT" == "success" ]]; then
            state=success
            description="Tests approved and passed"
          else
            state=failure
            description="Tests failed or approval revoked"
          fi

          gh api "repos/$REPOSITORY/statuses/$PR_HEAD_SHA" \
            --method POST \
            -f "state=$state" \
            -f context=test-gate \
            -f "description=$description"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ needs.approve.outputs.sha }}
          TEST_RESULT: ${{ needs.run-tests.result }}

  revoke-approval:
    runs-on: ubuntu-latest
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/stop-test' &&
      (
        contains(
          fromJSON(vars.MAINTAINERS || '[]'),
          github.event.comment.user.login
        ) ||
        contains(
          fromJSON(vars.MAINTAINER_ASSOCIATIONS || '["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.comment.author_association
        )
      )
    steps:
      - name: Remove approval label and update test-gate status
        run: |
          gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" \
            --remove-label "ok-to-test"
          sha=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
            --json headRefOid --jq .headRefOid)
          gh api "repos/$REPOSITORY/statuses/$sha" \
            --method POST \
            -f state=failure \
            -f context=test-gate \
            -f description="Test approval revoked"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
