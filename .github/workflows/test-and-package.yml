name: Test and Package

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout
        required: false
        type: string
    secrets:
      FOO:
        description: FOO secret passed as Maven system property
        required: false

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests
        run: mvn test

      - name: Run package
        run: mvn package -Dfoo.secret=$FOO
        env:
          FOO: ${{ secrets.FOO }}
