name: PR Build, test and package if approved

on:
  pull_request:
    branches: [main]
  issue_comment:
    types: [created]

jobs:
  welcome:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    steps:
      - name: Post available commands
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "$(cat <<'EOF'
          **Available commands:**
          | Command | Description |
          |---------|-------------|
          | `/ok-to-test` | Run tests and package (maintainers only) |
          | `/help` | Show this help message |
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  help:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/help')
    steps:
      - name: Post available commands
        run: |
          gh pr comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "$(cat <<'EOF'
          **Available commands:**
          | Command | Description |
          |---------|-------------|
          | `/ok-to-test` | Run tests and package (maintainers only) |
          | `/help` | Show this help message |
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Check secrets
        run: |
          if [ -n "$FOO" ]; then
            echo "FOO secret is set"
          else
            echo "FOO secret is NOT set"
          fi
        env:
          FOO: ${{ secrets.FOO }}

  test-package:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/ok-to-test') &&
      contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - name: Get PR branch
        id: pr
        run: |
          PR_REF=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName --jq '.headRefName')
          echo "ref=$PR_REF" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Check secrets
        run: |
          if [ -n "$FOO" ]; then
            echo "FOO secret is set"
          else
            echo "FOO secret is NOT set"
          fi
        env:
          FOO: ${{ secrets.FOO }}

      - name: Run tests
        run: mvn test

      - name: Run package
        run: mvn package
