name: PR Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  statuses: write

env:
  MAINTAINER_ASSOCIATIONS: '["OWNER", "MEMBER", "COLLABORATOR"]'

jobs:
  build:
    uses: ./.github/workflows/build.yml

  # NOTE: this job (and test-and-package/set-test-gate below) is expected to be
  # skipped on a freshly opened PR, since the ok-to-test label cannot exist yet.
  # It only has a chance to run on a later 'synchronize' event (a new push to
  # an already-approved PR), because labels added via GITHUB_TOKEN automation
  # (see pr-commands.yml) do not themselves trigger a new 'labeled' workflow
  # run - GitHub does not cascade workflow runs from events generated by the
  # GITHUB_TOKEN. The initial test run for a PR is performed directly by
  # pr-commands.yml when the /ok-to-test command is posted; this workflow's
  # job exists to re-run tests on subsequent pushes so new commits can't
  # bypass approval.
  check-approval:
    if: contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.approval.outputs.approved }}
    steps:
      - name: Check latest maintainer approval command
        id: approval
        run: |
          approved=$(gh api --paginate --slurp \
            "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" |
            jq -r --argjson maintainers "$MAINTAINERS" \
              --argjson associations "$MAINTAINER_ASSOCIATIONS" '
              [ .[][] |
                select(
                  (.user.login as $login | $maintainers | index($login)) or
                  (.author_association as $assoc | $associations | index($assoc))
                ) |
                select(.body == "/ok-to-test" or .body == "/stop-test")
              ] |
              sort_by(.created_at) |
              (last // {}) |
              (.body == "/ok-to-test")
            ')
          echo "DEBUG approved=[$approved]"
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAINTAINERS: ${{ vars.MAINTAINERS || '[]' }}
          MAINTAINER_ASSOCIATIONS: ${{ env.MAINTAINER_ASSOCIATIONS }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}

  test-and-package:
    needs: check-approval
    if: >
      needs.check-approval.outputs.approved == 'true' &&
      contains(github.event.pull_request.labels.*.name, 'ok-to-test') &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 'ok-to-test') &&
      (github.event.action != 'unlabeled' ||
       github.event.label.name != 'ok-to-test')
    uses: ./.github/workflows/test-and-package.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      FOO: ${{ secrets.FOO }}

  set-test-gate:
    needs: [check-approval, test-and-package]
    if: >
      always() &&
      (needs.test-and-package.result != 'skipped' ||
       (github.event.action == 'unlabeled' &&
        github.event.label.name == 'ok-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: Update test-gate status
        run: |
          if [[ "$TEST_RESULT" == "success" ]]; then
            state=success
            description="Tests approved and passed"
          else
            state=failure
            description="Tests failed or approval removed"
          fi

          gh api "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
            --method POST \
            -f "state=$state" \
            -f context=test-gate \
            -f "description=$description"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_RESULT: ${{ needs.test-and-package.result }}
