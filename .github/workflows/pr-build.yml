name: PR Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read
  statuses: write

jobs:
  build:
    if: >
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  test-and-package:
    needs: [build]
    if: >
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    uses: ./.github/workflows/test-and-package.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      FOO: ${{ secrets.FOO }}

  set-test-gate:
    needs: [test-and-package]
    runs-on: ubuntu-latest
    steps:
      - name: Set test-gate status to success
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ github.event.pull_request.head.sha }}" \
            --method POST \
            -f state=success \
            -f context=test-gate \
            -f description="Tests approved and passed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
