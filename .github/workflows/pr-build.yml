name: PR Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  welcome:
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - name: Post available commands
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "$(cat <<'EOF'
          **Available commands:**
          | Command | Description |
          |---------|-------------|
          | `/ok-to-test` | Approve and run tests + package (maintainers only). Persists: new pushes auto-trigger tests. |
          | `/stop-test` | Remove test approval (maintainers only) |
          | `/help` | Show this help message |
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    uses: ./.github/workflows/build.yml

  test-on-push:
    if: >
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    uses: ./.github/workflows/test-and-package.yml

  set-test-gate:
    needs: test-on-push
    runs-on: ubuntu-latest
    steps:
      - name: Set test-gate status to success
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            --method POST \
            -f state=success \
            -f context=test-gate \
            -f description="Tests approved and passed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
